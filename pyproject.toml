[project]
name = "lebensassistent"
version = "0.0.1"
description = "Lokal testbarer Kern des Home-Assistant-Add-ons Lebensassistent."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.162.7",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["uv_build==0.13.6"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "httpx2==2.16.0",
    "pytest==9.2.0",
    "ruff==0.17.5",
]
